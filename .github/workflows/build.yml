name: Build LC Share

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            runner: windows-latest
            binary: lc-share-windows-amd64.exe

          - name: Linux amd64
            runner: ubuntu-latest
            binary: lc-share-linux-amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Check Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(git ls-files '*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              echo "These Go files need gofmt:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build application
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lc-share-${{ matrix.name }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
